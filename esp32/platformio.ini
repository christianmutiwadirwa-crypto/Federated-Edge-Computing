; ===========================================================================
; PlatformIO Project Configuration
; Predictive Maintenance Edge Node – ESP32
; ===========================================================================
[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework = arduino

; Serial monitor baud rate
monitor_speed = 115200

; Upload speed – 921600 baud is fully supported by the CP2102/CH340
; USB-to-serial chips on the ESP32 WROOM-32 DevKit V1
upload_speed = 921600

; Partition scheme: huge_app maximises app space (~3 MB) on the 4 MB flash.
; OTA update slots are sacrificed – acceptable for a wired production node.
board_build.partitions = huge_app.csv

; FreeRTOS task stack sizes are generous; enable overflow checking
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DCONFIG_FREERTOS_USE_TRACE_FACILITY=1

